<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MHD Wattalpam</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00959b"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f7f7;--c:#fff;--t:#17262b;--m:#5b6b70;--p:#00959b;--a:#b8507a;--b:#d8e6e9;--bad:#c23b5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181a;--c:#192326;--t:#e8f0f1;--m:#9bb0b5;--p:#36c2c2;--b:#2b3a3e;--bad:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
header{background:linear-gradient(110deg,#00a3a3,#40bde8);color:#fff;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:4px solid #b8507a}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:1px solid var(--b);background:var(--bg);color:var(--t);padding:8px 12px;border-radius:8px}
nav button.on{background:linear-gradient(110deg,#00959b,#2fb0d8);color:#fff;border-color:transparent}
main{padding:10px;max-width:900px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-top:3px solid #b8507a;border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px;color:var(--p)}h3{margin:10px 0 6px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{background:var(--bg);border-radius:8px;padding:8px}.k b{display:block;font-size:17px}.k span{color:var(--m);font-size:12px}
label{display:block;font-size:12px;color:var(--m);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button.a{background:linear-gradient(110deg,#00959b,#2fb0d8);color:#fff;border:0;padding:10px 14px;border-radius:8px;margin-top:10px;font:inherit;font-weight:600}
button.s{background:var(--bg);color:var(--t);border:1px solid var(--b)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
.bad{color:var(--bad);font-weight:700}.m{color:var(--m);font-size:12px}
#inv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;padding:10px;z-index:9}
#inv .card{max-width:520px;margin:20px auto}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;background:#fff;color:#000;display:block}.no{display:none}}
</style></head><body>
<header>MHD Wattalpam — Business Manager <span class="m" style="color:#e0ffff">(data stays in this browser)</span></header>
<nav id="nav"></nav><main id="main"></main><div id="inv"></div>
<script>
const KEY='mhd_v1',$=i=>document.getElementById(i),r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>'Rs. '+r2(n).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Colombo'}),dmy=d=>d?d.split('-').reverse().join('/'):'';
const IT=[['Eggs','pcs','ing'],['Sugar','kg','ing'],['Jaggery','kg','ing'],['Vanilla essence','ml','ing'],['Dark sugar syrup','ml','ing'],['Cardamom','g','ing'],['Cinnamon','g','ing'],['Salt','g','ing'],['Firewood','bundle','ing'],['80 ml cups','pcs','pack'],['Spoons','pcs','pack'],['Stickers','pcs','pack'],['Bags','pcs','pack']];
const def=()=>({items:IT.map((x,i)=>({id:'i'+i,name:x[0],unit:x[1],cat:x[2],qty:0,value:0,min:0})),recipe:{base:400,lines:{i0:400,i1:6,i2:15}},grns:[],batches:[],shops:[],invoices:[],payments:[],expenses:[],allocs:[],wd:[],cfg:{o1:'Owner 1',o2:'Owner 2',pct:{reserve:50,operating:10,owner1:20,owner2:20},seq:{inv:0,grn:0,id:0},addr:'No.2/B,2, Muslim Road, Welipenna',biz:'MHD PRODUCTS',phone:''}});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save in this browser. Use Backup to download your data.')}};
const uid=()=>'x'+(++S.cfg.seq.id);const item=id=>S.items.find(i=>i.id==id)||(S.removed||[]).find(i=>i.id==id),shop=id=>S.shops.find(s=>s.id==id);
const val=i=>$(i).value,num=i=>parseFloat($(i).value)||0;
const free15=p=>Math.floor(Math.max(0,p)/15);
const shopBal=id=>r2(S.invoices.filter(i=>i.shop==id).reduce((a,i)=>a+i.total-i.pay,0)-(shop(id).credit||0));
function pay(shopId,amt,method,ref,date,only){ // allocate oldest-first
  let left=amt,al=[];for(const i of S.invoices.filter(i=>i.shop==shopId&&(!only||i.no==only)&&i.total-i.pay>0.004)){const a=Math.min(left,r2(i.total-i.pay));if(a>0){i.pay=r2(i.pay+a);left=r2(left-a);al.push({inv:i.no,amt:a})}}
  if(left>0)shop(shopId).credit=r2((shop(shopId).credit||0)+left);
  S.payments.push({id:uid(),date,shop:shopId,amt,method,ref,alloc:al,unalloc:left});}
let tab='dash';const T=[['dash','Dashboard'],['buy','Purchases'],['stock','Stock'],['prod','Production'],['shops','Shops'],['sell','Sales'],['pays','Payments'],['money','Profit & Owners'],['data','Settings']];
function go(t){tab=t;render()}
function render(){$('nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('main').innerHTML=V[tab]();if(tab=='prod')recalc();if(tab=='buy')shopList();save()}
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="m">Nothing yet</td></tr>`}</table></div>`;
const opts=(a,f)=>a.map(f).join('');
function fin(){const rev=S.invoices.reduce((a,i)=>a+i.total,0),cogs=S.invoices.reduce((a,i)=>a+i.cogs,0),be=S.expenses.filter(e=>e.fund=='business').reduce((a,e)=>a+e.amt,0),oe=S.expenses.filter(e=>e.fund=='operating').reduce((a,e)=>a+e.amt,0);
const net=r2(rev-cogs-be),done=S.allocs.reduce((a,x)=>a+x.base,0),sm=k=>S.allocs.reduce((a,x)=>a+x[k],0),w=k=>S.wd.filter(x=>x.o==k).reduce((a,x)=>a+x.amt,0);
return{rev,cogs,be,oe,net,avail:Math.max(0,r2(net-done)),reserve:sm('reserve'),oper:r2(sm('operating')-oe),o1:r2(sm('owner1')-w('o1')),o2:r2(sm('owner2')-w('o2'))}}
const kp=(l,v,c)=>`<div class="k"><span>${l}</span><b class="${c||''}">${v}</b></div>`;
const V={
dash(){const f=fin(),t=today(),mo=t.slice(0,7),ar=S.invoices.reduce((a,i)=>a+i.total-i.pay,0)-S.shops.reduce((a,s)=>a+(s.credit||0),0);
const ws=new Date(Date.now()-6*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Colombo'}),S_=(fn)=>S.invoices.filter(fn).reduce((a,i)=>a+i.total,0);
const fv=S.batches.reduce((a,b)=>a+b.rem*b.cpc,0),rv=S.items.reduce((a,i)=>a+i.value,0),cups=S.batches.reduce((a,b)=>a+b.rem,0);
const low=S.items.filter(i=>i.min>0&&i.qty<=i.min),exp=S.batches.filter(b=>b.rem>0&&b.expiry&&b.expiry<=new Date(Date.now()+3*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Colombo'}));
const lb=S.batches[S.batches.length-1];
return`<div class="card"><h2>Sales &amp; cash</h2><div class="g">${kp("Today's sales",fmt(S_(i=>i.date==t)))}${kp('Last 7 days',fmt(S_(i=>i.date>=ws)))}${kp('This month',fmt(S_(i=>i.date.startsWith(mo))))}${kp('Cash received (all time)',fmt(S.payments.reduce((a,p)=>a+p.amt,0)))}${kp('Owed by shops',fmt(ar),ar>0?'bad':'')}</div></div>
<div class="card"><h2>Stock</h2><div class="g">${kp('Saleable cups',cups)}${kp('Finished stock value',fmt(fv))}${kp('Ingredient/packaging value',fmt(rv))}${lb?kp('Last batch '+lb.no,fmt(lb.cpc)+'/cup'):''}</div>
${low.length?`<p class="bad">Low stock: ${low.map(i=>esc(i.name)).join(', ')}</p>`:''}${exp.length?`<p class="bad">Expiring soon: ${exp.map(b=>b.no+' ('+dmy(b.expiry)+')').join(', ')}</p>`:''}</div>
<div class="card"><h2>Profit (sold cups only)</h2><div class="g">${kp('Revenue',fmt(f.rev))}${kp('Cost of cups sold + free',fmt(f.cogs))}${kp('Business expenses',fmt(f.be))}${kp('Net profit',fmt(f.net),f.net<0?'bad':'')}</div><p class="m">Unsold stock is not an expense. Credit sales are not cash.</p></div>
<div class="card"><h2>Funds</h2><div class="g">${kp('Company reserve',fmt(f.reserve))}${kp('Operating fund',fmt(f.oper))}${kp(esc(S.cfg.o1),fmt(f.o1),f.o1<0?'bad':'')}${kp(esc(S.cfg.o2),fmt(f.o2),f.o2<0?'bad':'')}</div></div>
<div class="card"><h2>Recent invoices</h2>${tbl(['No','Date','Shop','Total','Balance'],S.invoices.slice(-5).reverse().map(i=>[`<a href="#" onclick="showInv('${i.no}');return false">${i.no}</a>`,dmy(i.date),esc(shop(i.shop)?.name),fmt(i.total),fmt(i.total-i.pay)]))}</div>`},
buy(){return`<div class="card"><h2>What to buy for a batch</h2><label>Eggs planned</label><input id="l_e" type="number" value="400" oninput="shopList()"><div id="l_o"></div></div><div class="card"><h2>New purchase (GRN)</h2><label>Date</label><input id="b_d" type="date" value="${today()}"><label>Supplier</label><input id="b_s"><label>Item</label><select id="b_i">${opts(S.items.filter(i=>i.active!==false),i=>`<option value="${i.id}">${esc(i.name)} (${i.unit})</option>`)}</select><label>Quantity</label><input id="b_q" type="number" step="any"><label>Unit price (Rs.)</label><input id="b_p" type="number" step="any"><label>Extra cost, e.g. transport (Rs.)</label><input id="b_x" type="number" step="any" value="0"><label>Amount paid now (Rs.)</label><input id="b_a" type="number" step="any"><label>Receipt no.</label><input id="b_r"><button class="a" onclick="addGrn()">Save purchase</button></div>
<div class="card"><h2>Purchases</h2>${tbl(['GRN','Date','Supplier','Item','Qty','Unit price','Total','Paid'],S.grns.slice().reverse().map(g=>[g.no,dmy(g.date),esc(g.sup),esc(item(g.item)?.name),g.q,fmt(g.p),fmt(g.q*g.p+g.x),fmt(g.paid)]))}</div>`},
stock(){return`<div class="card"><h2>Stock (average cost)</h2>${tbl(['Item','Unit','Qty','Avg cost','Value','Min'],S.items.map(i=>[esc(i.name),i.unit,r2(i.qty*1000)/1000,i.qty?fmt(i.value/i.qty):'-',fmt(i.value),i.min]))}</div>
<div class="card"><h2>Add item</h2><label>Name</label><input id="n_n"><label>Unit</label><input id="n_u" placeholder="kg, pcs, ml..."><label>Type</label><select id="n_c"><option value="ing">Ingredient</option><option value="pack">Packaging</option></select><label>Minimum stock</label><input id="n_m" type="number" value="0"><button class="a" onclick="addItem()">Add item</button></div>
<div class="card"><h2>Finished cups</h2>${tbl(['Batch','Cups left','Cost/cup','Value','Expiry'],S.batches.map(b=>[b.no,b.rem,fmt(b.cpc),fmt(b.rem*b.cpc),dmy(b.expiry)]))}</div>`},
prod(){const ing=S.items.filter(i=>i.cat=='ing'),pk=S.items.filter(i=>i.cat=='pack');
return`<div class="card"><h2>New production batch</h2><label>Production date</label><input id="p_d" type="date" value="${today()}"><label>Eggs to use</label><input id="p_e" type="number" value="${S.recipe.base}" oninput="recalc()">
<h3>Ingredients <span class="m">(recipe base = ${S.recipe.base} eggs; edit std or actual)</span></h3><label>Recipe base eggs</label><input id="p_base" type="number" value="${S.recipe.base}" onchange="S.recipe.base=num('p_base')||400;save();recalc()">
${tbl(['Item','Std recipe','Planned','Actual used','In stock'],ing.map(i=>[esc(i.name)+' ('+i.unit+')',`<input style="width:80px" id="s_${i.id}" type="number" step="any" value="${S.recipe.lines[i.id]||0}" onchange="S.recipe.lines['${i.id}']=num('s_${i.id}');save();recalc()">`,`<span id="pl_${i.id}"></span>`,`<input style="width:90px" id="a_${i.id}" type="number" step="any">`,r2(i.qty*1000)/1000]))}
<h3>Packaging used</h3>${tbl(['Item','Qty used','In stock'],pk.map(i=>[esc(i.name),`<input style="width:90px" id="k_${i.id}" type="number" step="any" value="0">`,i.qty]))}
<label>Fuel / firewood cost (Rs.)</label><input id="p_f" type="number" step="any" value="0"><label>Other batch costs (Rs.)</label><input id="p_o" type="number" step="any" value="0">
<label>Good cups produced</label><input id="p_g" type="number"><label>Defective cups</label><input id="p_x" type="number" value="0"><label>Shelf life (days, optional)</label><input id="p_s" type="number"><label>Notes</label><input id="p_n">
<button class="a" onclick="addBatch()">Finish batch &amp; deduct stock</button><p class="m">Cost per good cup = total batch cost ÷ good cups. Defective cups' cost is carried by the good cups.</p></div>
<div class="card"><h2>Batches</h2>${tbl(['Batch','Week','Date','Eggs','Good','Bad','Total cost','Cost/cup','Left'],S.batches.slice().reverse().map(b=>[b.no,b.week,dmy(b.date),b.eggs,b.good,b.bad,fmt(b.total),fmt(b.cpc),b.rem]))}</div>`},
shops(){return`<div class="card"><h2>Add shop / hotel</h2><label>Shop name</label><input id="h_n"><label>City</label><input id="h_c"><label>Contact number</label><input id="h_p"><label>Price per paid cup (Rs.)</label><input id="h_r" type="number" step="any"><label>WhatsApp number (optional)</label><input id="h_w"><button class="a" onclick="addShop()">Save shop</button></div>
<div class="card"><h2>Shops</h2>${tbl(['Shop','City','Phone','Price (Rs.)','Balance'],S.shops.map(s=>[esc(s.name),esc(s.city),esc(s.phone),`<input style="width:80px" type="number" step="any" value="${s.price||''}" placeholder="set" onchange="setPrice('${s.id}',this.value)">`,`<span class="${shopBal(s.id)>0?'bad':''}">${fmt(shopBal(s.id))}</span>`]))}</div>`},
sell(){return`<div class="card"><h2>New delivery / invoice</h2><label>Date</label><input id="d_d" type="date" value="${today()}"><label>Shop</label><select id="d_s" onchange="shopPick()"><option value="">Select</option>${opts(S.shops,s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.city)}</option>`)}</select>
<label>Batch</label><select id="d_b">${opts(S.batches.filter(b=>b.rem>0),b=>`<option value="${b.no}">${b.no} — ${b.rem} left</option>`)}</select>
<label>Paid cups</label><input id="d_q" type="number" oninput="sellCalc()"><label>Free cups (blank = 1 per 15 paid)</label><input id="d_f" type="number" oninput="sellCalc()"><label>Price per paid cup</label><input id="d_p" type="number" step="any" oninput="sellCalc()">
<label>Amount received now (Rs.)</label><input id="d_a" type="number" step="any" value="0"><label>Method</label><select id="d_m"><option>Cash</option><option>Bank transfer</option><option>Other</option></select>
<p id="d_pv" class="m"></p><button class="a" id="d_btn" onclick="addSale()">Save invoice</button></div>`},
pays(){return`<div class="card"><h2>Receive payment</h2><label>Date</label><input id="y_d" type="date" value="${today()}"><label>Shop</label><select id="y_s">${opts(S.shops,s=>`<option value="${s.id}">${esc(s.name)} (owes ${fmt(shopBal(s.id))})</option>`)}</select><label>Amount</label><input id="y_a" type="number" step="any"><label>Method</label><select id="y_m"><option>Cash</option><option>Bank transfer</option><option>Other</option></select><label>Reference</label><input id="y_r"><button class="a" onclick="addPay()">Save payment</button><p class="m">Settles the oldest unpaid invoices first. Extra is kept as shop credit.</p></div>
<div class="card"><h2>Payments</h2>${tbl(['Date','Shop','Amount','Method','Allocated to'],S.payments.slice().reverse().map(p=>[dmy(p.date),esc(shop(p.shop)?.name),fmt(p.amt),p.method,p.alloc.map(a=>a.inv).join(', ')+(p.unalloc?' +credit '+fmt(p.unalloc):'')]))}</div>`},
money(){const f=fin(),c=S.cfg;return`<div class="card"><h2>Profit allocation</h2><div class="g">${kp('Net profit so far',fmt(f.net),f.net<0?'bad':'')}${kp('Not yet allocated',fmt(f.avail))}</div><button class="a" onclick="alloc()">Allocate ${fmt(f.avail)} (${c.pct.reserve}/${c.pct.operating}/${c.pct.owner1}/${c.pct.owner2}%)</button><p class="m">Allocations are tracked so the same profit is never allocated twice. A loss is never allocated. Reserve and owner shares are allocations of profit, not extra income.</p>${tbl(['Date','Base','Reserve','Operating',esc(c.o1),esc(c.o2)],S.allocs.map(a=>[dmy(a.date),fmt(a.base),fmt(a.reserve),fmt(a.operating),fmt(a.owner1),fmt(a.owner2)]))}</div>
<div class="card"><h2>Record expense</h2><label>Date</label><input id="e_d" type="date" value="${today()}"><label>Description</label><input id="e_n"><label>Amount</label><input id="e_a" type="number" step="any"><label>Paid from</label><select id="e_f"><option value="business">Business (reduces profit)</option><option value="operating">Operating fund (already allocated)</option></select><button class="a" onclick="addExp()">Save expense</button>${tbl(['Date','What','Amount','From'],S.expenses.slice().reverse().map(e=>[dmy(e.date),esc(e.n),fmt(e.amt),e.fund]))}</div>
<div class="card"><h2>Owner withdrawal</h2><label>Owner</label><select id="w_o"><option value="o1">${esc(c.o1)}</option><option value="o2">${esc(c.o2)}</option></select><label>Amount</label><input id="w_a" type="number" step="any"><label>Note</label><input id="w_n"><button class="a" onclick="addWd()">Save withdrawal</button><p>${esc(c.o1)}: <b class="${f.o1<0?'bad':''}">${fmt(f.o1)}</b> &nbsp; ${esc(c.o2)}: <b class="${f.o2<0?'bad':''}">${fmt(f.o2)}</b></p><p class="m">Withdrawals are not business expenses. A negative balance means overdrawn.</p></div>`},
data(){const c=S.cfg;return`<div class="card"><h2>Settings</h2><label>Owner 1 name</label><input id="c_1" value="${esc(c.o1)}"><label>Owner 2 name</label><input id="c_2" value="${esc(c.o2)}"><label>Business name (on invoices)</label><input id="c_b" value="${esc(c.biz)}"><label>Address</label><input id="c_ad" value="${esc(c.addr)}"><label>Phone</label><input id="c_ph" value="${esc(c.phone)}">
<label>Allocation %: reserve / operating / owner 1 / owner 2</label><div class="g"><input id="c_p1" type="number" value="${c.pct.reserve}"><input id="c_p2" type="number" value="${c.pct.operating}"><input id="c_p3" type="number" value="${c.pct.owner1}"><input id="c_p4" type="number" value="${c.pct.owner2}"></div><button class="a" onclick="saveCfg()">Save settings</button></div>
<div class="card"><h2>Backup</h2><p class="m">Your data lives only in this browser on this device. Copy a backup often and keep the text somewhere safe (WhatsApp message to yourself, Notes or email). Paste it below to restore.</p><button class="a" onclick="backup()">Download backup file</button> <button class="a s" onclick="backupText()">Copy backup text</button> <button class="a s" onclick="csv()">Invoices CSV</button><label>Restore: paste your backup text here</label><textarea id="rs" rows="3" placeholder="Paste backup text"></textarea><button class="a s" onclick="restoreText()">Restore from text</button><input type="file" accept=".json" onchange="restore(this)"><button class="a s" style="color:var(--bad)" onclick="if(confirm('Delete ALL data on this device?')&&confirm('Really delete everything?')){S=def();save();render()}">Erase everything</button></div>`}};
function addGrn(){const q=num('b_q'),p=num('b_p'),x=num('b_x'),it=item(val('b_i'));if(q<=0||p<0||!val('b_p'))return alert('Enter quantity and unit price');
const paid=num('b_a');it.qty+=q;it.value+=q*p+x;const no='GRN-'+String(++S.cfg.seq.grn).padStart(5,'0');S.grns.push({no,date:val('b_d'),sup:val('b_s'),item:it.id,q,p,x,paid,rec:val('b_r')});render()}
function addItem(){if(!val('n_n')||!val('n_u'))return alert('Enter name and unit');S.items.push({id:uid(),name:val('n_n'),unit:val('n_u'),cat:val('n_c'),qty:0,value:0,min:num('n_m')});render()}
function recalc(){const e=num('p_e'),b=S.recipe.base;expShow(e);S.items.filter(i=>i.cat=='ing').forEach(i=>{const p=r2(((S.recipe.lines[i.id]||0)*e/b)*1000)/1000;$('pl_'+i.id).textContent=p;$('a_'+i.id).value=p})}
function weekLbl(d){const [y,m,dd]=d.split('-').map(Number),f=(new Date(y,m-1,1).getDay()+6)%7;return String(y).slice(2)+'-'+String(m).padStart(2,'0')+'-W'+String(Math.ceil((dd+f)/7)).padStart(2,'0')}
function addBatch(){const d=val('p_d'),good=num('p_g');if(!d||good<=0)return alert('Enter date and good cups');
const use=[];let ic=0,pc=0;for(const i of S.items){const q=num((i.cat=='ing'?'a_':'k_')+i.id);if(q>0){if(q>i.qty+1e-9)return alert('Not enough '+i.name+' in stock ('+i.qty+' '+i.unit+')');const c=q*(i.value/i.qty);use.push({i,q,c});i.cat=='ing'?ic+=c:pc+=c}}
const fuel=num('p_f'),oth=num('p_o'),total=ic+pc+fuel+oth;if(total<=0)return alert('Batch cost is zero — enter ingredients and purchases first');
use.forEach(u=>{u.i.qty-=u.q;u.i.value-=u.c;if(u.i.qty<1e-9){u.i.qty=0;u.i.value=0}});
const n=S.batches.filter(b=>b.date==d).length+1,no='MHD-'+d.replace(/-/g,'')+'-'+String(n).padStart(2,'0'),sl=num('p_s');
S.batches.push({no,date:d,week:weekLbl(d),eggs:num('p_e'),ing:ic,pack:pc,fuel,oth,total,good,bad:num('p_x'),cpc:total/good,rem:good,expiry:sl?new Date(new Date(d).getTime()+sl*864e5).toISOString().slice(0,10):'',notes:val('p_n'),used:use.map(u=>({id:u.i.id,q:u.q,c:u.c}))});alert('Batch '+no+' saved. Cost per cup '+fmt(total/good));render()}
function addShop(){if(!val('h_n')||!val('h_c')||!val('h_p')||!num('h_r'))return alert('Fill name, city, contact number and price');S.shops.push({id:uid(),name:val('h_n'),city:val('h_c'),phone:val('h_p'),wa:val('h_w'),price:num('h_r'),credit:0});render()}
function shopPick(){const s=shop(val('d_s'));if(s)$('d_p').value=s.price||'';sellCalc()}
function sellCalc(){const q=num('d_q'),f=val('d_f')!==''?num('d_f'):free15(q);$('d_pv').textContent=`Bill ${fmt(q*num('d_p'))} · free ${f} · cups deducted ${q+f}`}
function addSale(){const b=S.batches.find(x=>x.no==val('d_b')),s=shop(val('d_s')),q=num('d_q'),f=val('d_f')!==''?num('d_f'):free15(q),pr=num('d_p');
if(!s||!b||q<=0||pr<=0)return alert('Select shop, batch, quantity and price');if(q+f>b.rem)return alert('Only '+b.rem+' cups left in this batch');
const prev=shopBal(s.id),total=r2(q*pr),rec=Math.min(num('d_a'),total);$('d_btn').disabled=true;
const no='INV-'+String(++S.cfg.seq.inv).padStart(5,'0');S.invoices.push({no,date:val('d_d'),shop:s.id,batch:b.no,paid:q,free:f,price:pr,total,cogs:(q+f)*b.cpc,pay:0,prev});b.rem-=q+f;
if(rec>0)pay(s.id,rec,val('d_m'),no,val('d_d'),no);render();showInv(no)}

function alloc(){const f=fin(),p=S.cfg.pct;if(f.avail<=0)return alert('No new profit to allocate');if(!confirm('Allocate '+fmt(f.avail)+'?'))return;
const op=r2(f.avail*p.operating/100),o1=r2(f.avail*p.owner1/100),o2=r2(f.avail*p.owner2/100);S.allocs.push({date:today(),base:f.avail,operating:op,owner1:o1,owner2:o2,reserve:r2(f.avail-op-o1-o2)});render()}
